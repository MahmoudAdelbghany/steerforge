[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "steerforge"
version = "0.1.0"
description = "Unsloth-style persona discovery and serving for activation steering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SteerForge contributors" }]
keywords = ["llm", "steering", "interpretability", "persona", "qwen", "llama.cpp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "huggingface_hub>=0.24",
  "pyyaml>=6.0",
  "gguf>=0.10",
]

[project.optional-dependencies]
hf = [
  "torch>=2.4",
  "transformers>=5.0",
  "accelerate>=0.34",
  "safetensors>=0.4",
]
serve = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
all = [
  "torch>=2.4",
  "transformers>=5.0",
  "accelerate>=0.34",
  "safetensors>=0.4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
steerforge = "steerforge.cli:app"
sf = "steerforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/steerforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: tests that load a model",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
